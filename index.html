<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MangaVault - Seu Organizador de Mangás</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans pb-12">
  <div class="max-w-6xl mx-auto px-4 py-6">
    
    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8 border-b border-gray-800 pb-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid font-bold text-3xl text-brand-500 fa-book-open"></i>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-brand-500 to-purple-400 bg-clip-text text-transparent">MangaVault</h1>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="exportData()" class="px-3 py-1.5 text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg transition border border-gray-700 flex items-center gap-1.5">
          <i class="fa-solid fa-download"></i> Exportar
        </button>
        <label class="px-3 py-1.5 text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg transition border border-gray-700 cursor-pointer flex items-center gap-1.5">
          <i class="fa-solid fa-upload"></i> Importar
          <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden" />
        </label>
      </div>
    </header>

    <!-- Form Section -->
    <section class="bg-gray-900 border border-gray-800 rounded-2xl p-4 sm:p-6 mb-8 shadow-xl">
      <h2 id="formTitle" class="text-lg font-semibold mb-4 text-brand-500 flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> Adicionar Novo Mangá / One-Shot
      </h2>
      
      <form id="mangaForm" onsubmit="saveManga(event)" class="space-y-4">
        <input type="hidden" id="editIndex" value="-1" />
        
        <div>
          <label class="block text-xs text-gray-400 mb-1">Link / URL do Mangá *</label>
          <input type="url" id="mangaUrl" required onchange="autoFillFromUrl()" placeholder="https://site.com/manga-exemplo/" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
        </div>

        <!-- Extração via Código-Fonte (User-Assisted Scraping) -->
        <div class="bg-gray-950/60 border border-gray-800/80 rounded-xl p-3">
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-xs font-medium text-brand-400 flex items-center gap-1.5">
              <i class="fa-solid fa-code"></i> Extração Automática via HTML (Opcional)
            </label>
            <span class="text-[10px] text-gray-500">Copie o view-source: da página</span>
          </div>
          <div class="flex gap-2">
            <textarea id="htmlSourceCode" rows="1" placeholder="Cole aqui o código HTML ou view-source: para extrair capa, sinopse e tags..." class="w-full bg-gray-900 border border-gray-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-gray-300"></textarea>
            <button type="button" onclick="parseHtmlSource()" class="px-3 py-1.5 bg-gray-800 hover:bg-brand-600 text-gray-200 hover:text-white rounded-lg text-xs font-medium transition whitespace-nowrap flex items-center gap-1">
              <i class="fa-solid fa-wand-magic-sparkles"></i> Extrair
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Título do Mangá *</label>
            <input type="text" id="mangaTitle" required placeholder="Ex: Título da Obra" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">Autor</label>
            <input type="text" id="mangaAuthor" placeholder="Login Necessário" value="Login Necessário" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">Nome do Site / Fonte</label>
            <input type="text" id="mangaSource" placeholder="Ex: bakai.org" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">Status de Leitura</label>
            <select id="mangaStatus" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200">
              <option value="Lido" selected>Lido</option>
              <option value="Quero Ler">Quero Ler</option>
              <option value="Lendo">Lendo</option>
              <option value="Pausado">Pausado</option>
            </select>
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">URL da Imagem de Capa (Opcional)</label>
            <input type="url" id="mangaCover" placeholder="https://..." class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">Tags / Gêneros (separados por vírgula)</label>
            <input type="text" id="mangaTags" placeholder="Romance, Gyaru, One-Shot" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
          </div>
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1">Sinopse / Anotações</label>
          <textarea id="mangaSynopsis" rows="2" placeholder="Resumo ou observações pessoais sobre a obra..." class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200"></textarea>
        </div>

        <div class="flex gap-2 justify-end">
          <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-sm transition">Cancelar</button>
          <button type="submit" id="saveBtn" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg text-sm transition flex items-center gap-2">
            <i class="fa-solid fa-bookmark"></i> Salvar na Biblioteca
          </button>
        </div>
      </form>
    </section>

    <!-- Search & Filters -->
    <section class="mb-6 space-y-4">
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-500 text-sm"></i>
          <input type="text" id="searchInput" oninput="renderLibrary()" placeholder="Buscar por título, autor, site, sinopse ou tag..." class="w-full pl-9 pr-4 py-2.5 bg-gray-900 border border-gray-800 rounded-xl text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
        </div>
        <select id="statusFilter" onchange="renderLibrary()" class="bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-500 text-gray-200">
          <option value="Todos">Todos os Status</option>
          <option value="Lido">Lido</option>
          <option value="Quero Ler">Quero Ler</option>
          <option value="Lendo">Lendo</option>
          <option value="Pausado">Pausado</option>
        </select>
      </div>
      
      <!-- Tag Filter Pills -->
      <div id="activeTagFilter" class="hidden items-center gap-2 text-xs bg-brand-900/30 border border-brand-800 text-brand-300 px-3 py-1.5 rounded-lg w-fit">
        <span>Filtrando por tag: <strong id="selectedTagName"></strong></span>
        <button onclick="clearTagFilter()" class="hover:text-white ml-2"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </section>

    <!-- Library Grid -->
    <main id="libraryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      <!-- Cards dinâmicos -->
    </main>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16 bg-gray-900/50 border border-gray-800/50 rounded-2xl">
      <i class="fa-solid fa-folder-open text-4xl text-gray-600 mb-3"></i>
      <p class="text-gray-400 text-sm">Nenhum mangá encontrado na sua biblioteca.</p>
    </div>
  </div>

  <script>
    let library = JSON.parse(localStorage.getItem('mangaVaultData')) || [];
    let selectedTag = '';

    function saveToStorage() {
      localStorage.setItem('mangaVaultData', JSON.stringify(library));
    }

    function autoFillFromUrl() {
      const urlInput = document.getElementById('mangaUrl').value.trim();
      if (!urlInput) return;

      try {
        const parsedUrl = new URL(urlInput);
        const domain = parsedUrl.hostname.replace('www.', '');
        
        const sourceInput = document.getElementById('mangaSource');
        if (!sourceInput.value) {
          sourceInput.value = domain;
        }

        const titleInput = document.getElementById('mangaTitle');
        if (!titleInput.value) {
          const pathSegments = parsedUrl.pathname.split('/').filter(Boolean);
          if (pathSegments.length > 0) {
            let lastSegment = pathSegments[pathSegments.length - 1];
            let cleanTitle = lastSegment
              .replace(/-/g, ' ')
              .replace(/r\d+/i, '')
              .replace(/\b\w/g, l => l.toUpperCase());
            titleInput.value = cleanTitle.trim();
          }
        }
      } catch (e) {}
    }

    function parseHtmlSource() {
      const rawHtml = document.getElementById('htmlSourceCode').value.trim();
      if (!rawHtml) {
        alert('Por favor, cole o código HTML no campo antes de clicar em Extrair.');
        return;
      }

      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(rawHtml, 'text/html');

        // Extrair Título
        const ogTitle = doc.querySelector('meta[property="og:title"]')?.content;
        const pageTitle = doc.querySelector('title')?.textContent;
        const extractedTitle = ogTitle || pageTitle;
        if (extractedTitle) {
          document.getElementById('mangaTitle').value = extractedTitle
            .replace(/ - Ler Online.*/i, '')
            .replace(/ \| .*/, '')
            .trim();
        }

        // Extrair Capa
        const ogImage = doc.querySelector('meta[property="og:image"]')?.content;
        const mainImg = doc.querySelector('article img, .entry-content img, .cover img')?.src;
        if (ogImage || mainImg) {
          document.getElementById('mangaCover').value = ogImage || mainImg;
        }

        // Extrair Sinopse / Descrição
        const ogDesc = doc.querySelector('meta[property="og:description"]')?.content;
        const metaDesc = doc.querySelector('meta[name="description"]')?.content;
        if (ogDesc || metaDesc) {
          document.getElementById('mangaSynopsis').value = (ogDesc || metaDesc).trim();
        }

        // Extrair Meta Keywords como Tags
        const keywords = doc.querySelector('meta[name="keywords"]')?.content;
        if (keywords) {
          const currentTags = document.getElementById('mangaTags').value;
          document.getElementById('mangaTags').value = currentTags ? `${currentTags}, ${keywords}` : keywords;
        }

        alert('✨ Dados extraídos com sucesso do HTML!');
      } catch (err) {
        alert('Não foi possível ler a estrutura deste HTML.');
      }
    }

    function saveManga(event) {
      event.preventDefault();
      
      const url = document.getElementById('mangaUrl').value.trim();
      const title = document.getElementById('mangaTitle').value.trim();
      const author = document.getElementById('mangaAuthor').value.trim() || 'Login Necessário';
      const source = document.getElementById('mangaSource').value.trim();
      const status = document.getElementById('mangaStatus').value;
      const cover = document.getElementById('mangaCover').value.trim();
      const synopsis = document.getElementById('mangaSynopsis').value.trim();
      const tagsInput = document.getElementById('mangaTags').value.trim();
      const editIndex = parseInt(document.getElementById('editIndex').value);

      let tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(Boolean) : [];
      if (source && !tags.includes(source)) {
        tags.unshift(source);
      }

      if (editIndex === -1) {
        const isDuplicateUrl = library.some(item => item.url.toLowerCase() === url.toLowerCase());
        const isDuplicateTitle = library.some(item => item.title.toLowerCase() === title.toLowerCase());

        if (isDuplicateUrl || isDuplicateTitle) {
          alert('⚠️ ATENÇÃO: Este mangá ou link já está cadastrado na sua biblioteca!');
          return;
        }
      }

      const mangaItem = { url, title, author, source, status, cover, synopsis, tags, updatedAt: new Date().toISOString() };

      if (editIndex === -1) {
        library.unshift(mangaItem);
      } else {
        library[editIndex] = mangaItem;
      }

      saveToStorage();
      resetForm();
      renderLibrary();
    }

    function editManga(index) {
      const item = library[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('mangaUrl').value = item.url;
      document.getElementById('mangaTitle').value = item.title;
      document.getElementById('mangaAuthor').value = item.author || 'Login Necessário';
      document.getElementById('mangaSource').value = item.source || '';
      document.getElementById('mangaStatus').value = item.status;
      document.getElementById('mangaCover').value = item.cover || '';
      document.getElementById('mangaSynopsis').value = item.synopsis || '';
      document.getElementById('mangaTags').value = item.tags ? item.tags.join(', ') : '';
      document.getElementById('htmlSourceCode').value = '';

      document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen"></i> Editar Mangá';
      document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-check"></i> Salvar Alterações';
      document.getElementById('cancelBtn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteManga(index) {
      if (confirm('Tem certeza que deseja remover este mangá?')) {
        library.splice(index, 1);
        saveToStorage();
        renderLibrary();
      }
    }

    function resetForm() {
      document.getElementById('mangaForm').reset();
      document.getElementById('editIndex').value = -1;
      document.getElementById('mangaAuthor').value = 'Login Necessário';
      document.getElementById('mangaStatus').value = 'Lido';
      document.getElementById('htmlSourceCode').value = '';
      document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-plus"></i> Adicionar Novo Mangá / One-Shot';
      document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-bookmark"></i> Salvar na Biblioteca';
      document.getElementById('cancelBtn').classList.add('hidden');
    }

    function filterByTag(tag) {
      selectedTag = tag;
      document.getElementById('selectedTagName').innerText = tag;
      document.getElementById('activeTagFilter').classList.remove('hidden');
      document.getElementById('activeTagFilter').classList.add('flex');
      renderLibrary();
    }

    function clearTagFilter() {
      selectedTag = '';
      document.getElementById('activeTagFilter').classList.add('hidden');
      document.getElementById('activeTagFilter').classList.remove('flex');
      renderLibrary();
    }

    function renderLibrary() {
      const grid = document.getElementById('libraryGrid');
      const emptyState = document.getElementById('emptyState');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;

      grid.innerHTML = '';

      const filtered = library.filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(search) ||
                              (item.author && item.author.toLowerCase().includes(search)) ||
                              (item.synopsis && item.synopsis.toLowerCase().includes(search)) ||
                              (item.tags && item.tags.some(t => t.toLowerCase().includes(search)));
        
        const matchesStatus = statusFilter === 'Todos' || item.status === statusFilter;
        const matchesTag = !selectedTag || (item.tags && item.tags.includes(selectedTag));

        return matchesSearch && matchesStatus && matchesTag;
      });

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      filtered.forEach((item) => {
        const realIndex = library.indexOf(item);
        const coverUrl = item.cover || 'https://via.placeholder.com/300x420/111827/9CA3AF?text=Sem+Capa';
        
        const card = document.createElement('div');
        card.className = 'bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-lg flex flex-col justify-between hover:border-gray-700 transition';
        card.innerHTML = `
          <div>
            <div class="relative aspect-[3/4] overflow-hidden bg-gray-950">
              <img src="${coverUrl}" alt="${item.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300x420/111827/9CA3AF?text=Sem+Capa'" />
              <span class="absolute top-2 right-2 text-[10px] font-semibold px-2 py-0.5 rounded-full bg-gray-950/80 text-brand-300 backdrop-blur-sm border border-gray-700">
                ${item.status}
              </span>
            </div>
            
            <div class="p-3">
              <h3 class="font-semibold text-sm line-clamp-1 text-gray-100" title="${item.title}">${item.title}</h3>
              <p class="text-[11px] text-gray-400 mt-0.5"><i class="fa-solid fa-user text-[10px]"></i> ${item.author || 'Login Necessário'}</p>
              
              ${item.synopsis ? `<p class="text-[11px] text-gray-500 line-clamp-2 mt-1.5">${item.synopsis}</p>` : ''}

              <div class="flex flex-wrap gap-1 mt-2">
                ${item.tags ? item.tags.map(t => `
                  <button onclick="filterByTag('${t}')" class="text-[10px] bg-gray-800 hover:bg-brand-950 hover:text-brand-300 text-gray-400 px-2 py-0.5 rounded transition">
                    #${t}
                  </button>
                `).join('') : ''}
              </div>
            </div>
          </div>

          <div class="p-3 pt-0 flex gap-2 border-t border-gray-800/50 mt-2">
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="flex-1 text-center py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded text-xs font-medium transition flex items-center justify-center gap-1">
              <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> Ler
            </a>
            <button onclick="editManga(${realIndex})" class="px-2 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded text-xs transition">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button onclick="deleteManga(${realIndex})" class="px-2 py-1.5 bg-gray-800 hover:bg-red-900/50 text-gray-400 hover:text-red-300 rounded text-xs transition">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(library, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `mangavault_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            library = imported;
            saveToStorage();
            renderLibrary();
            alert('Biblioteca importada com sucesso!');
          } else {
            alert('Formato de arquivo JSON inválido.');
          }
        } catch (err) {
          alert('Erro ao ler o arquivo de backup.');
        }
      };
      reader.readAsText(file);
    }

    renderLibrary();
  </script>
</body>
</html>
