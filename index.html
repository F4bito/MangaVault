<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MangaVault - Seu Organizador de Conteúdo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/wanakana"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans pb-12">
  <div class="max-w-6xl mx-auto px-4 py-6">
    
    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6 border-b border-gray-800 pb-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid font-bold text-3xl text-brand-500 fa-book-open"></i>
        <div>
          <h1 class="text-2xl font-bold bg-gradient-to-r from-brand-500 to-purple-400 bg-clip-text text-transparent">MangaVault</h1>
          <p class="text-[10px] text-gray-500">Organizador Pessoal de Mídias & Links</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="startQuickQueue()" id="quickQueueBtn" class="px-3 py-1.5 text-xs bg-amber-950/60 hover:bg-amber-900/70 text-amber-300 rounded-lg transition border border-amber-800/60 flex items-center gap-1.5">
          <i class="fa-solid fa-bolt"></i> Fila Rápida (<span id="pendingCount">0</span>)
        </button>
        <button onclick="exportData()" class="px-3 py-1.5 text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg transition border border-gray-700 flex items-center gap-1.5">
          <i class="fa-solid fa-download"></i> Exportar
        </button>
        <label class="px-3 py-1.5 text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg transition border border-gray-700 cursor-pointer flex items-center gap-1.5">
          <i class="fa-solid fa-upload"></i> Importar
          <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden" />
        </label>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-gray-800 mb-6 gap-2 text-sm font-medium overflow-x-auto">
      <button class="py-2 px-4 border-b-2 border-brand-500 text-brand-400 flex items-center gap-2 whitespace-nowrap">
        <i class="fa-solid fa-book"></i> Mangás & One-Shots
      </button>
      <button onclick="showToast('Aba de Animes será ativada em breve!', 'info')" class="py-2 px-4 text-gray-500 hover:text-gray-300 flex items-center gap-2 transition whitespace-nowrap">
        <i class="fa-solid fa-tv"></i> Animes (Em breve)
      </button>
      <button onclick="showToast('Aba de Links Gerais será ativada em breve!', 'info')" class="py-2 px-4 text-gray-500 hover:text-gray-300 flex items-center gap-2 transition whitespace-nowrap">
        <i class="fa-solid fa-link"></i> Links Gerais (Em breve)
      </button>
    </div>

    <!-- Banner Modo Fila Rápida -->
    <div id="queueBanner" class="hidden bg-amber-950/40 border border-amber-700/60 rounded-xl p-3 mb-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="flex items-center gap-2 text-xs text-amber-200">
        <i class="fa-solid fa-bolt text-amber-400"></i>
        <span><strong>Modo Fila Rápida Ativo:</strong> Editando item pendente. Ao salvar, o próximo será carregado automaticamente.</span>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="skipQueueItem()" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded text-xs transition">
          Pular <i class="fa-solid fa-forward-step ml-1"></i>
        </button>
        <button type="button" onclick="stopQuickQueue()" class="px-3 py-1 bg-red-950/70 hover:bg-red-900 text-red-200 rounded text-xs transition">
          Sair da Fila
        </button>
      </div>
    </div>

    <!-- Form Section -->
    <section id="formSection" class="bg-gray-900 border border-gray-800 rounded-2xl p-4 sm:p-6 mb-8 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h2 id="formTitle" class="text-lg font-semibold text-brand-500 flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Adicionar Novo Mangá / One-Shot
        </h2>
        <label class="flex items-center gap-1.5 cursor-pointer text-xs text-gray-300 bg-gray-950 px-3 py-1.5 rounded-lg border border-gray-800 hover:border-yellow-500/50 transition">
          <input type="checkbox" id="mangaFavorite" class="accent-yellow-400 w-3.5 h-3.5" />
          <i class="fa-solid fa-star text-yellow-400"></i> Favorito
        </label>
      </div>
      
      <form id="mangaForm" onsubmit="saveManga(event)" class="space-y-4">
        <input type="hidden" id="editIndex" value="-1" />
        
        <div>
          <label class="block text-xs text-gray-400 mb-1">Link / URL do Mangá *</label>
          <input type="url" id="mangaUrl" required oninput="handleUrlInput()" placeholder="https://site.com/manga-exemplo/" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
        </div>

        <!-- Gerador de Texto view-source -->
        <div id="viewSourceContainer" class="hidden bg-gray-950/80 border border-gray-800/80 rounded-xl p-3 space-y-3">
          <div>
            <label class="block text-xs font-medium text-brand-400 mb-1">
              <i class="fa-solid fa-code"></i> Copie este texto e cole na barra de endereços do navegador:
            </label>
            <div class="flex gap-2">
              <input type="text" id="viewSourceText" readonly onclick="this.select()" class="w-full bg-gray-900 border border-gray-800 rounded-lg px-3 py-1.5 text-xs text-brand-300 font-mono select-all focus:outline-none focus:border-brand-500" />
              <button type="button" id="copyVsBtn" onclick="copyViewSourceText()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-lg text-xs font-medium transition whitespace-nowrap flex items-center gap-1">
                <i class="fa-solid fa-clone"></i> Copiar
              </button>
            </div>
          </div>

          <div class="pt-2 border-t border-gray-800/60">
            <label class="block text-[11px] text-gray-400 mb-1">Cole o HTML copiado aqui (Opcional):</label>
            <div class="flex gap-2">
              <textarea id="htmlSourceCode" rows="1" placeholder="Cole aqui o HTML para extrair Capa, Autor, Tags e Traduzir Título..." class="w-full bg-gray-900 border border-gray-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 text-gray-300"></textarea>
              <button type="button" onclick="parseHtmlSource()" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-medium transition whitespace-nowrap flex items-center gap-1">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Extrair Dados
              </button>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Título Original *</label>
            <input type="text" id="mangaTitle" required placeholder="Ex: Gishiki no Yoru ni" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
          </div>

          <div>
            <div class="flex justify-between items-center gap-1 mb-1">
              <label class="block text-xs text-gray-400 truncate">Título Alternativo (PT-BR)</label>
              <div class="flex items-center gap-1 shrink-0">
                <select id="sourceLangSelect" title="Idioma de origem" class="bg-gray-950 border border-gray-700 rounded px-1.5 py-0.5 text-[10px] text-gray-300 focus:outline-none focus:border-brand-500">
                  <option value="auto">Auto</option>
                  <option value="ja">Japonês / Romaji</option>
                  <option value="ko">Coreano</option>
                  <option value="zh-CN">Chinês</option>
                  <option value="en">Inglês</option>
                </select>
                <button type="button" onclick="translateTitleManual()" class="text-[10px] bg-brand-950 hover:bg-brand-900 text-brand-300 border border-brand-800/70 px-2 py-0.5 rounded flex items-center gap-1 transition">
                  <i class="fa-solid fa-language"></i> Traduzir
                </button>
              </div>
            </div>
            <input type="text" id="mangaAltTitle" placeholder="Tradução em português (opcional)" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">Autor / Artista</label>
            <input type="text" id="mangaAuthor" placeholder="Login Necessário" value="Login Necessário" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">Link do Perfil do Autor (Opcional)</label>
            <input type="url" id="mangaAuthorUrl" placeholder="https://site.com/autor/..." class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">Nome do Site / Fonte</label>
            <input type="text" id="mangaSource" placeholder="Ex: bakai.org" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">Status de Leitura</label>
            <select id="mangaStatus" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200">
              <option value="Lido" selected>Lido</option>
              <option value="Quero Ler">Quero Ler</option>
              <option value="Lendo">Lendo</option>
              <option value="Pausado">Pausado</option>
            </select>
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">URL da Imagem de Capa (Opcional)</label>
            <input type="url" id="mangaCover" placeholder="https://..." class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
          </div>

          <div class="sm:col-span-2">
            <label class="block text-xs text-gray-400 mb-1">Tags / Gêneros (separados por vírgula)</label>
            <input type="text" id="mangaTags" placeholder="Romance, Gyaru, One-Shot" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
          </div>
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1">Sinopse / Anotações (Manual)</label>
          <textarea id="mangaSynopsis" rows="2" placeholder="Resumo ou observações pessoais sobre a obra..." class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-gray-200"></textarea>
        </div>

        <div class="flex gap-2 justify-end">
          <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-sm transition">Cancelar</button>
          <button type="submit" id="saveBtn" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg text-sm transition flex items-center gap-2">
            <i class="fa-solid fa-bookmark"></i> Salvar na Biblioteca
          </button>
        </div>
      </form>
    </section>

    <!-- Search & Filters -->
    <section class="mb-6 space-y-4">
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-500 text-sm"></i>
          <input type="text" id="searchInput" oninput="renderLibrary()" placeholder="Buscar por título original, título PT, autor, site, sinopse ou tag..." class="w-full pl-9 pr-4 py-2.5 bg-gray-900 border border-gray-800 rounded-xl text-sm focus:outline-none focus:border-brand-500 text-gray-200" />
        </div>
        <select id="statusFilter" onchange="renderLibrary()" class="bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-500 text-gray-200">
          <option value="Todos">Todos os Status</option>
          <option value="Favoritos">⭐ Apenas Favoritos</option>
          <option value="Pendentes">⚠️ Pendentes de Dados</option>
          <option value="Lido">Lido</option>
          <option value="Quero Ler">Quero Ler</option>
          <option value="Lendo">Lendo</option>
          <option value="Pausado">Pausado</option>
        </select>
      </div>
      
      <!-- Tag Filter Pills -->
      <div id="activeTagFilter" class="hidden items-center gap-2 text-xs bg-brand-900/30 border border-brand-800 text-brand-300 px-3 py-1.5 rounded-lg w-fit">
        <span>Filtrando por tag: <strong id="selectedTagName"></strong></span>
        <button onclick="clearTagFilter()" class="hover:text-white ml-2"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </section>

    <!-- Library Grid -->
    <main id="libraryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      <!-- Cards dinâmicos -->
    </main>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16 bg-gray-900/50 border border-gray-800/50 rounded-2xl">
      <i class="fa-solid fa-folder-open text-4xl text-gray-600 mb-3"></i>
      <p class="text-gray-400 text-sm">Nenhum mangá encontrado na sua biblioteca.</p>
    </div>
  </div>

  <!-- Modal de Visualização Expandida do Card -->
  <div id="cardModal" onclick="closeCardModal()" class="hidden fixed inset-0 z-40 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div onclick="event.stopPropagation()" class="bg-gray-900 border border-gray-800 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- Container de Notificações Toast -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    let library = JSON.parse(localStorage.getItem('mangaVaultData')) || [];
    let selectedTag = '';
    let isQueueMode = false;
    let skippedUrls = new Set();

    // Sistema de Toast Flutuante Não-Intrusivo
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      const styles = {
        success: 'bg-gray-900 border-brand-500/70 text-gray-100',
        warning: 'bg-amber-950/95 border-amber-500/70 text-amber-100',
        error: 'bg-red-950/95 border-red-500/70 text-red-100',
        info: 'bg-gray-900 border-gray-700 text-gray-200'
      };

      const icons = {
        success: 'fa-circle-check text-brand-400',
        warning: 'fa-triangle-exclamation text-amber-400',
        error: 'fa-circle-xmark text-red-400',
        info: 'fa-circle-info text-blue-400'
      };

      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl border shadow-2xl backdrop-blur-md text-xs font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${styles[type] || styles.info}`;
      toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-sm"></i><span>${message}</span>`;

      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    // Migração automática para compatibilidade com registros antigos
    library = library.map(item => ({
      favorite: false,
      altTitle: '',
      authorUrl: '',
      ...item
    }));

    function saveToStorage() {
      localStorage.setItem('mangaVaultData', JSON.stringify(library));
      updatePendingCounter();
    }

    function isItemPending(item) {
      const noCover = !item.cover || item.cover.trim() === '';
      const defaultAuthor = !item.author || item.author === 'Login Necessário';
      const fewTags = !item.tags || item.tags.filter(t => t !== item.source).length === 0;
      return noCover || defaultAuthor || fewTags;
    }

    function updatePendingCounter() {
      const count = library.filter(isItemPending).length;
      const counterEl = document.getElementById('pendingCount');
      if (counterEl) counterEl.innerText = count;
    }

    // Modal de Detalhes Expandido (Inclui Exclusão Segura em 2 Etapas)
    function openCardModal(index) {
      const item = library[index];
      if (!item) return;

      const coverUrl = item.cover || 'https://via.placeholder.com/300x420/111827/9CA3AF?text=Sem+Capa';
      const modal = document.getElementById('cardModal');
      const content = document.getElementById('modalContent');

      const authorHtml = item.authorUrl
        ? `<a href="${item.authorUrl}" target="_blank" rel="noopener noreferrer" class="text-brand-400 hover:text-brand-300 underline inline-flex items-center gap-1">
             ${item.author || 'Login Necessário'} <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
           </a>`
        : `<span class="text-gray-200">${item.author || 'Login Necessário'}</span>`;

      content.innerHTML = `
        <div class="p-5 sm:p-6">
          <div class="flex justify-between items-start gap-4 mb-4">
            <div class="flex items-center gap-2">
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-brand-950 text-brand-300 border border-brand-800">
                ${item.status}
              </span>
              ${item.source ? `<span class="text-xs px-2.5 py-1 rounded-full bg-gray-800 text-gray-300">${item.source}</span>` : ''}
            </div>
            <button onclick="closeCardModal()" class="text-gray-400 hover:text-white p-1.5 rounded-lg bg-gray-800/70 hover:bg-gray-800 transition">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div class="flex flex-col sm:flex-row gap-5">
            <div class="w-40 sm:w-48 mx-auto sm:mx-0 shrink-0 aspect-[3/4] rounded-xl overflow-hidden bg-gray-950 border border-gray-800">
              <img src="${coverUrl}" alt="${item.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300x420/111827/9CA3AF?text=Sem+Capa'" />
            </div>

            <div class="flex-1 space-y-3">
              <div>
                <span class="text-[10px] uppercase tracking-wider text-gray-500">Título Original</span>
                <h2 class="text-lg sm:text-xl font-bold text-gray-100 leading-snug">${item.title}</h2>
              </div>

              ${item.altTitle ? `
                <div class="bg-brand-950/30 border border-brand-900/50 rounded-lg px-3 py-2">
                  <span class="text-[10px] uppercase tracking-wider text-brand-400 block">Título Alternativo (PT-BR)</span>
                  <p class="text-sm font-medium text-brand-200">${item.altTitle}</p>
                </div>
              ` : ''}

              <div class="text-sm text-gray-400 flex items-center gap-2">
                <i class="fa-solid fa-user text-gray-500"></i>
                <span>Autor: ${authorHtml}</span>
              </div>

              <div>
                <span class="text-[10px] uppercase tracking-wider text-gray-500 block mb-1">Sinopse / Anotações</span>
                <p class="text-xs sm:text-sm text-gray-300 bg-gray-950/70 p-3 rounded-xl border border-gray-800 whitespace-pre-line">
                  ${item.synopsis || 'Nenhuma sinopse ou anotação registrada.'}
                </p>
              </div>

              ${item.tags && item.tags.length > 0 ? `
                <div>
                  <span class="text-[10px] uppercase tracking-wider text-gray-500 block mb-1.5">Tags</span>
                  <div class="flex flex-wrap gap-1.5">
                    ${item.tags.map(t => `
                      <button onclick="filterByTag('${t}'); closeCardModal();" class="text-xs bg-gray-800 hover:bg-brand-950 hover:text-brand-300 text-gray-300 px-2.5 py-1 rounded-md transition">
                        #${t}
                      </button>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>
          </div>

          <!-- Ações Principais do Modal -->
          <div class="flex flex-wrap gap-2 mt-6 pt-4 border-t border-gray-800">
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="flex-1 min-w-[120px] text-center py-2.5 px-4 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-medium transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i> Abrir Obra
            </a>
            <button onclick="toggleFavorite(${index}); openCardModal(${index});" class="px-4 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-xl text-sm transition flex items-center gap-1.5">
              <i class="fa-solid fa-star ${item.favorite ? 'text-yellow-400' : 'text-gray-400'}"></i> ${item.favorite ? 'Favorito' : 'Favoritar'}
            </button>
            <button onclick="closeCardModal(); editManga(${index});" class="px-4 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-xl text-sm transition flex items-center gap-1.5">
              <i class="fa-solid fa-pen"></i> Editar
            </button>
            <button id="deleteTriggerBtn" onclick="promptDeleteInModal()" class="px-4 py-2.5 bg-gray-800 hover:bg-red-950/70 text-gray-400 hover:text-red-300 border border-transparent hover:border-red-800/60 rounded-xl text-sm transition flex items-center gap-1.5">
              <i class="fa-solid fa-trash"></i> Excluir
            </button>
          </div>

          <!-- Confirmação Inline de Exclusão -->
          <div id="deleteConfirmBar" class="hidden mt-3 p-3 bg-red-950/50 border border-red-800/70 rounded-xl flex flex-col sm:flex-row items-center justify-between gap-3">
            <span class="text-xs text-red-200 flex items-center gap-2">
              <i class="fa-solid fa-triangle-exclamation text-red-400"></i>
              Tem certeza que deseja excluir esta obra permanentemente?
            </span>
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
              <button onclick="cancelDeleteInModal()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-lg text-xs transition">
                Cancelar
              </button>
              <button onclick="confirmDeleteManga(${index})" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg text-xs transition flex items-center gap-1">
                <i class="fa-solid fa-trash"></i> Sim, Excluir
              </button>
            </div>
          </div>
        </div>
      `;

      modal.classList.remove('hidden');
    }

    function promptDeleteInModal() {
      document.getElementById('deleteTriggerBtn')?.classList.add('hidden');
      document.getElementById('deleteConfirmBar')?.classList.remove('hidden');
    }

    function cancelDeleteInModal() {
      document.getElementById('deleteConfirmBar')?.classList.add('hidden');
      document.getElementById('deleteTriggerBtn')?.classList.remove('hidden');
    }

    function confirmDeleteManga(index) {
      library.splice(index, 1);
      saveToStorage();
      closeCardModal();
      renderLibrary();
      showToast('Mangá excluído da biblioteca.', 'info');
    }

    function closeCardModal() {
      document.getElementById('cardModal').classList.add('hidden');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeCardModal();
    });

    // Controles da Fila de Edição Rápida
    function startQuickQueue() {
      skippedUrls.clear();
      const nextIndex = library.findIndex(item => isItemPending(item));
      if (nextIndex === -1) {
        showToast('Todos os mangás da sua biblioteca já estão completos!', 'success');
        return;
      }
      isQueueMode = true;
      document.getElementById('queueBanner').classList.remove('hidden');
      editManga(nextIndex);
    }

    function skipQueueItem() {
      const currentIndex = parseInt(document.getElementById('editIndex').value);
      if (currentIndex !== -1 && library[currentIndex]) {
        skippedUrls.add(library[currentIndex].url);
      }
      loadNextInQueue();
    }

    function loadNextInQueue() {
      const nextIndex = library.findIndex(item => isItemPending(item) && !skippedUrls.has(item.url));
      if (nextIndex === -1) {
        stopQuickQueue();
        showToast('Fila rápida concluída!', 'success');
        return;
      }
      editManga(nextIndex);
    }

    function stopQuickQueue() {
      isQueueMode = false;
      skippedUrls.clear();
      document.getElementById('queueBanner').classList.add('hidden');
      resetForm();
    }

    function toggleFavorite(index) {
      library[index].favorite = !library[index].favorite;
      saveToStorage();
      renderLibrary();
      showToast(library[index].favorite ? 'Adicionado aos favoritos' : 'Removido dos favoritos', 'info');
    }

    function handleUrlInput() {
      const urlInput = document.getElementById('mangaUrl').value.trim();
      const container = document.getElementById('viewSourceContainer');
      const viewSourceTextField = document.getElementById('viewSourceText');

      if (!urlInput) {
        container.classList.add('hidden');
        return;
      }

      try {
        const parsedUrl = new URL(urlInput);
        const domain = parsedUrl.hostname.replace('www.', '');
        
        const sourceInput = document.getElementById('mangaSource');
        if (!sourceInput.value) sourceInput.value = domain;

        const titleInput = document.getElementById('mangaTitle');
        if (!titleInput.value) {
          const pathSegments = parsedUrl.pathname.split('/').filter(Boolean);
          if (pathSegments.length > 0) {
            let lastSegment = pathSegments[pathSegments.length - 1];
            let cleanTitle = lastSegment
              .replace(/-/g, ' ')
              .replace(/r\d+/i, '')
              .replace(/\b\w/g, l => l.toUpperCase());
            titleInput.value = cleanTitle.trim();
          }
        }

        viewSourceTextField.value = `view-source:${urlInput}`;
        container.classList.remove('hidden');

      } catch (e) {
        container.classList.add('hidden');
      }
    }

    function copyViewSourceText() {
      const field = document.getElementById('viewSourceText');
      const btn = document.getElementById('copyVsBtn');
      field.select();
      navigator.clipboard.writeText(field.value);
      
      btn.innerHTML = '<i class="fa-solid fa-check text-green-400"></i> Copiado!';
      showToast('Comando view-source copiado para a área de transferência.', 'success');
      
      setTimeout(() => {
        btn.innerHTML = '<i class="fa-solid fa-clone"></i> Copiar';
      }, 2000);
    }

    // Converte Romaji para Hiragana quando necessário (para a API traduzir corretamente)
    function prepareJapaneseText(text) {
      if (typeof wanakana === 'undefined') return text;
      // Se já tem Hiragana, Katakana ou Kanji, mantém original
      if (wanakana.isJapanese(text)) return text;
      // Converte texto em letras latinas (Romaji) para Hiragana
      return wanakana.toHiragana(text.toLowerCase(), { IMEMode: false });
    }

    // Tradução via Google Translate + WanaKana (Romaji) + Fallback MyMemory
    async function translateToPtBR(text, sourceLang = 'auto') {
      if (!text || text.trim().length === 0) return { translated: '', ok: false };
      const cleanText = text.trim();

      // Se o usuário selecionou Japonês e digitou em Romaji (ex: "Watashi Wa"), converte para Hiragana antes de traduzir
      let queryText = cleanText;
      let effectiveLang = sourceLang;

      if (sourceLang === 'ja' && typeof wanakana !== 'undefined' && wanakana.isRomaji(cleanText)) {
        queryText = prepareJapaneseText(cleanText);
      }

      // Tentativa 1: Google Translate (gtx)
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(effectiveLang)}&tl=pt-BR&dt=t&q=${encodeURIComponent(queryText)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data && Array.isArray(data[0])) {
            const fullTranslated = data[0].map(segment => segment[0] || '').join('').trim();
            const detectedLang = (data[2] || '').toLowerCase();

            if (fullTranslated && fullTranslated.toLowerCase() !== cleanText.toLowerCase() && fullTranslated !== queryText) {
              if (effectiveLang !== 'auto') {
                return { translated: fullTranslated, ok: true };
              }
              const isPt = detectedLang === 'pt' || detectedLang === 'pt-br';
              if (!isPt) {
                return { translated: fullTranslated, ok: true };
              }
            }
          }
        }
      } catch (e) {
        console.warn('Google Translate falhou, tentando fallback...', e);
      }

      // Se estava em modo Auto e não traduziu (provável Romaji), tenta converter como Romaji Japonês
      if (sourceLang === 'auto' && typeof wanakana !== 'undefined' && wanakana.isRomaji(cleanText)) {
        const hiraganaText = prepareJapaneseText(cleanText);
        if (hiraganaText !== cleanText.toLowerCase()) {
          try {
            const jaUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=pt-BR&dt=t&q=${encodeURIComponent(hiraganaText)}`;
            const res = await fetch(jaUrl);
            if (res.ok) {
              const data = await res.json();
              const fullTranslated = data?.[0]?.map(s => s[0] || '').join('').trim();
              if (fullTranslated && fullTranslated !== hiraganaText && fullTranslated.toLowerCase() !== cleanText.toLowerCase()) {
                return { translated: fullTranslated, ok: true };
              }
            }
          } catch (e) {}
        }
      }

      // Tentativa 2 (Fallback): MyMemory API
      try {
        const pairLang = effectiveLang === 'auto' ? 'ja' : effectiveLang;
        const mmQuery = pairLang === 'ja' ? prepareJapaneseText(cleanText) : cleanText;
        const mmUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(mmQuery)}&langpair=${encodeURIComponent(pairLang)}|pt-BR`;
        const res = await fetch(mmUrl);
        if (res.ok) {
          const data = await res.json();
          const translated = (data?.responseData?.translatedText || '').trim();
          if (translated && translated.toLowerCase() !== cleanText.toLowerCase() && translated !== mmQuery) {
            return { translated, ok: true };
          }
        }
      } catch (e) {
        console.error('Fallback de tradução falhou:', e);
      }

      return { translated: '', ok: false };
    }

    async function translateTitleManual() {
      const titleInput = document.getElementById('mangaTitle');
      const altInput = document.getElementById('mangaAltTitle');
      const sourceLang = document.getElementById('sourceLangSelect').value;
      const sourceText = titleInput.value.trim();

      if (!sourceText) {
        showToast('Preencha o Título Original antes de traduzir.', 'warning');
        return;
      }

      altInput.value = 'Traduzindo...';
      const result = await translateToPtBR(sourceText, sourceLang);

      if (result.ok && result.translated) {
        altInput.value = result.translated;
        showToast('Título traduzido para Português!', 'success');
      } else {
        altInput.value = '';
        showToast('Não foi possível traduzir. Verifique se o idioma selecionado corresponde ao título.', 'warning');
      }
    }

    async function parseHtmlSource() {
      const rawHtml = document.getElementById('htmlSourceCode').value.trim();
      if (!rawHtml) {
        showToast('Cole o código HTML no campo antes de extrair.', 'warning');
        return;
      }

      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(rawHtml, 'text/html');

        // 1. EXTRAÇÃO VIA JSON-LD (Yoast SEO / Schema.org)
        const jsonLdScripts = doc.querySelectorAll('script[type="application/ld+json"]');
        let extractedKeywords = [];
        let jsonCover = '';
        let jsonTitle = '';

        jsonLdScripts.forEach(script => {
          try {
            const data = JSON.parse(script.textContent);
            const graph = data['@graph'] || [data];

            graph.forEach(item => {
              if (item.keywords && Array.isArray(item.keywords)) {
                extractedKeywords = extractedKeywords.concat(item.keywords);
              } else if (typeof item.keywords === 'string') {
                extractedKeywords = extractedKeywords.concat(item.keywords.split(',').map(k => k.trim()));
              }

              if (item.thumbnailUrl) jsonCover = item.thumbnailUrl;
              if (item.headline) jsonTitle = item.headline;
            });
          } catch (e) {}
        });

        const metaKeywords = doc.querySelector('meta[name="keywords"]')?.content;
        if (metaKeywords) {
          extractedKeywords = extractedKeywords.concat(metaKeywords.split(',').map(k => k.trim()));
        }

        if (extractedKeywords.length > 0) {
          const currentTags = document.getElementById('mangaTags').value;
          const existingList = currentTags ? currentTags.split(',').map(t => t.trim()).filter(Boolean) : [];
          const uniqueTags = Array.from(new Set([...existingList, ...extractedKeywords])).filter(Boolean);
          document.getElementById('mangaTags').value = uniqueTags.join(', ');
        }

        // 2. Extrair Título Original + Auto-Tradução para Título Alternativo
        const ogTitle = doc.querySelector('meta[property="og:title"]')?.content;
        const pageTitle = doc.querySelector('title')?.textContent;
        const rawTitle = (jsonTitle || ogTitle || pageTitle || '')
          .replace(/ - Ler Online.*/i, '')
          .replace(/ \| .*/, '')
          .trim();

        if (rawTitle) {
          document.getElementById('mangaTitle').value = rawTitle;
          const sourceLang = document.getElementById('sourceLangSelect').value;
          const translation = await translateToPtBR(rawTitle, sourceLang);
          if (translation.ok && translation.translated) {
            document.getElementById('mangaAltTitle').value = translation.translated;
          }
        }

        // 3. Extrair Autor (Busca textual explícita)
        const fullText = doc.body.textContent || rawHtml;
        const authorMatch = fullText.match(/(?:Artista|Autor|Author)\s*:\s*([^|<>\n\r]+)/i);
        if (authorMatch && authorMatch[1]) {
          document.getElementById('mangaAuthor').value = authorMatch[1].trim();
        }

        // 4. Extrair Capa
        const ogImage = doc.querySelector('meta[property="og:image"]')?.content;
        const mainImg = doc.querySelector('article img, .entry-content img, .cover img')?.src;
        if (jsonCover || ogImage || mainImg) {
          document.getElementById('mangaCover').value = jsonCover || ogImage || mainImg;
        }

        // 5. Filtrar Sinopse
        const rawDesc = doc.querySelector('meta[property="og:description"]')?.content || 
                        doc.querySelector('meta[name="description"]')?.content || '';
        
        const isGenericText = /leia agora|ler online|completo em português|baixe gratis/i.test(rawDesc);
        if (rawDesc && !isGenericText) {
          document.getElementById('mangaSynopsis').value = rawDesc.trim();
        }

        showToast('Dados do HTML extraídos com sucesso!', 'success');
      } catch (err) {
        showToast('Não foi possível ler a estrutura deste HTML.', 'error');
      }
    }

    function saveManga(event) {
      event.preventDefault();
      
      const url = document.getElementById('mangaUrl').value.trim();
      const title = document.getElementById('mangaTitle').value.trim();
      const altTitle = document.getElementById('mangaAltTitle').value.trim();
      const author = document.getElementById('mangaAuthor').value.trim() || 'Login Necessário';
      const authorUrl = document.getElementById('mangaAuthorUrl').value.trim();
      const source = document.getElementById('mangaSource').value.trim();
      const status = document.getElementById('mangaStatus').value;
      const cover = document.getElementById('mangaCover').value.trim();
      const synopsis = document.getElementById('mangaSynopsis').value.trim();
      const tagsInput = document.getElementById('mangaTags').value.trim();
      const favorite = document.getElementById('mangaFavorite').checked;
      const editIndex = parseInt(document.getElementById('editIndex').value);

      let tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(Boolean) : [];
      if (source && !tags.includes(source)) {
        tags.unshift(source);
      }

      if (editIndex === -1) {
        const isDuplicateUrl = library.some(item => item.url.toLowerCase() === url.toLowerCase());
        const isDuplicateTitle = library.some(item => item.title.toLowerCase() === title.toLowerCase());

        if (isDuplicateUrl || isDuplicateTitle) {
          showToast('Este mangá ou link já está cadastrado na biblioteca!', 'warning');
          return;
        }
      }

      const mangaItem = { url, title, altTitle, author, authorUrl, source, status, cover, synopsis, tags, favorite, updatedAt: new Date().toISOString() };

      if (editIndex === -1) {
        library.unshift(mangaItem);
        showToast('Mangá adicionado à biblioteca!', 'success');
      } else {
        library[editIndex] = mangaItem;
        showToast('Alterações salvas!', 'success');
      }

      saveToStorage();
      renderLibrary();

      if (isQueueMode) {
        loadNextInQueue();
      } else {
        resetForm();
      }
    }

    function editManga(index) {
      const item = library[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('mangaUrl').value = item.url;
      document.getElementById('mangaTitle').value = item.title;
      document.getElementById('mangaAltTitle').value = item.altTitle || '';
      document.getElementById('mangaAuthor').value = item.author || 'Login Necessário';
      document.getElementById('mangaAuthorUrl').value = item.authorUrl || '';
      document.getElementById('mangaSource').value = item.source || '';
      document.getElementById('mangaStatus').value = item.status;
      document.getElementById('mangaCover').value = item.cover || '';
      document.getElementById('mangaSynopsis').value = item.synopsis || '';
      document.getElementById('mangaTags').value = item.tags ? item.tags.join(', ') : '';
      document.getElementById('mangaFavorite').checked = !!item.favorite;
      document.getElementById('htmlSourceCode').value = '';
      
      handleUrlInput();

      document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen"></i> Editar Mangá';
      document.getElementById('saveBtn').innerHTML = isQueueMode 
        ? '<i class="fa-solid fa-forward"></i> Salvar & Próximo' 
        : '<i class="fa-solid fa-check"></i> Salvar Alterações';
      document.getElementById('cancelBtn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('mangaForm').reset();
      document.getElementById('editIndex').value = -1;
      document.getElementById('mangaAltTitle').value = '';
      document.getElementById('mangaAuthor').value = 'Login Necessário';
      document.getElementById('mangaAuthorUrl').value = '';
      document.getElementById('mangaStatus').value = 'Lido';
      document.getElementById('mangaFavorite').checked = false;
      document.getElementById('htmlSourceCode').value = '';
      document.getElementById('viewSourceContainer').classList.add('hidden');
      document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-plus"></i> Adicionar Novo Mangá / One-Shot';
      document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-bookmark"></i> Salvar na Biblioteca';
      document.getElementById('cancelBtn').classList.add('hidden');
    }

    function filterByTag(tag) {
      selectedTag = tag;
      document.getElementById('selectedTagName').innerText = tag;
      document.getElementById('activeTagFilter').classList.remove('hidden');
      document.getElementById('activeTagFilter').classList.add('flex');
      renderLibrary();
    }

    function clearTagFilter() {
      selectedTag = '';
      document.getElementById('activeTagFilter').classList.add('hidden');
      document.getElementById('activeTagFilter').classList.remove('flex');
      renderLibrary();
    }

    function renderLibrary() {
      const grid = document.getElementById('libraryGrid');
      const emptyState = document.getElementById('emptyState');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;

      grid.innerHTML = '';
      updatePendingCounter();

      const filtered = library.filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(search) ||
                              (item.altTitle && item.altTitle.toLowerCase().includes(search)) ||
                              (item.author && item.author.toLowerCase().includes(search)) ||
                              (item.synopsis && item.synopsis.toLowerCase().includes(search)) ||
                              (item.tags && item.tags.some(t => t.toLowerCase().includes(search)));
        
        let matchesStatus = true;
        if (statusFilter === 'Favoritos') {
          matchesStatus = !!item.favorite;
        } else if (statusFilter === 'Pendentes') {
          matchesStatus = isItemPending(item);
        } else if (statusFilter !== 'Todos') {
          matchesStatus = item.status === statusFilter;
        }

        const matchesTag = !selectedTag || (item.tags && item.tags.includes(selectedTag));

        return matchesSearch && matchesStatus && matchesTag;
      });

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      filtered.forEach((item) => {
        const realIndex = library.indexOf(item);
        const coverUrl = item.cover || 'https://via.placeholder.com/300x420/111827/9CA3AF?text=Sem+Capa';
        const pending = isItemPending(item);
        
        const card = document.createElement('div');
        card.className = `bg-gray-900 border ${item.favorite ? 'border-yellow-500/50' : 'border-gray-800'} rounded-xl overflow-hidden shadow-lg flex flex-col justify-between hover:border-gray-700 transition`;
        card.innerHTML = `
          <div>
            <div onclick="openCardModal(${realIndex})" class="relative aspect-[3/4] overflow-hidden bg-gray-950 cursor-pointer group">
              <img src="${coverUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/300x420/111827/9CA3AF?text=Sem+Capa'" />
              
              <button onclick="event.stopPropagation(); toggleFavorite(${realIndex});" title="Favoritar" class="absolute top-2 left-2 w-7 h-7 rounded-full bg-gray-950/80 backdrop-blur-sm border border-gray-700 flex items-center justify-center transition hover:scale-110">
                <i class="fa-solid fa-star text-xs ${item.favorite ? 'text-yellow-400' : 'text-gray-500'}"></i>
              </button>

              <div class="absolute top-2 right-2 flex items-center gap-1">
                ${pending ? `<span title="Pendente de dados (capa, autor ou tags)" class="text-[10px] px-1.5 py-0.5 rounded-full bg-amber-950/90 text-amber-300 border border-amber-700/70"><i class="fa-solid fa-triangle-exclamation"></i></span>` : ''}
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-gray-950/80 text-brand-300 backdrop-blur-sm border border-gray-700">
                  ${item.status}
                </span>
              </div>
            </div>
            
            <div class="p-3">
              <h3 onclick="openCardModal(${realIndex})" class="font-semibold text-sm line-clamp-1 text-gray-100 hover:text-brand-400 cursor-pointer transition" title="${item.title}">${item.title}</h3>
              ${item.altTitle ? `<p class="text-[11px] text-brand-300/90 line-clamp-1 mt-0.5" title="${item.altTitle}">${item.altTitle}</p>` : ''}
              
              <p class="text-[11px] text-gray-400 mt-0.5">
                <i class="fa-solid fa-user text-[10px]"></i> 
                ${item.authorUrl 
                  ? `<a href="${item.authorUrl}" target="_blank" rel="noopener noreferrer" class="text-brand-400 hover:underline">${item.author || 'Login Necessário'}</a>` 
                  : (item.author || 'Login Necessário')}
              </p>
              
              ${item.synopsis ? `<p class="text-[11px] text-gray-500 line-clamp-2 mt-1.5">${item.synopsis}</p>` : ''}

              <div class="flex flex-wrap gap-1 mt-2">
                ${item.tags ? item.tags.map(t => `
                  <button onclick="filterByTag('${t}')" class="text-[10px] bg-gray-800 hover:bg-brand-950 hover:text-brand-300 text-gray-400 px-2 py-0.5 rounded transition">
                    #${t}
                  </button>
                `).join('') : ''}
              </div>
            </div>
          </div>

          <div class="p-3 pt-0 flex gap-2 border-t border-gray-800/50 mt-2">
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="flex-1 text-center py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded text-xs font-medium transition flex items-center justify-center gap-1">
              <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> Ler
            </a>
            <button onclick="editManga(${realIndex})" title="Editar" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded text-xs transition flex items-center gap-1">
              <i class="fa-solid fa-pen"></i>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(library, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `mangavault_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('Backup exportado!', 'success');
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            library = imported.map(item => ({ favorite: false, altTitle: '', authorUrl: '', ...item }));
            saveToStorage();
            renderLibrary();
            showToast('Biblioteca importada com sucesso!', 'success');
          } else {
            showToast('Formato de arquivo JSON inválido.', 'error');
          }
        } catch (err) {
          showToast('Erro ao ler o arquivo de backup.', 'error');
        }
      };
      reader.readAsText(file);
    }

    renderLibrary();
  </script>
